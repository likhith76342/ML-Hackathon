# Shared constants. Change only after telling the whole team - every result depends on these.
data_root: data/raw            # contains train/ and student_test/ (copied as-is from the dataset)
processed_dir: data/processed
artifacts_dir: artifacts
results_dir: results
figures_dir: reports/figures

seed: 42
dataset_version: 1            # Zubed bumps this when features/candidates change -> everyone retrains
candidate_radius_m: 50         # arcs within this distance of a GPS point
max_candidates: 10             # keep the K nearest within the radius
n_cv_folds: 5                  # GroupKFold by trip_id on the 80 training trips
gap_break_s: 30                # HMM: time gap (s) that forces a sequence break

api:
  host: 0.0.0.0
  port: 8000
  eval_data_dir: data/raw/student_test   # demo day: point at the evaluator folder (or set EVAL_DATA_DIR)
